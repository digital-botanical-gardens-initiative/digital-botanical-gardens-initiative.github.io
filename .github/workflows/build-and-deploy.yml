name: Build and deploy website

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  repository_dispatch:
    types:
      - directus-updated
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
      HUGO_ENV: production
      TZ: Europe/Paris
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Checkout Directus explorer
        uses: actions/checkout@v4
        with:
          repository: digital-botanical-gardens-initiative/directus-explorer
          path: directus-explorer
          token: ${{ secrets.DIRECTUS_EXPLORER_TOKEN || github.token }}

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Install gnverifier
        run: go install github.com/gnames/gnverifier@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DBGI_REQUIRE_DIRECTUS_STATS: true
          DBGI_REQUIRE_INATURALIST_OBSERVATION: true
          DBGI_REQUIRE_TAXONOMIC_COVERAGE: true
          DIRECTUS_EXPLORER_DIR: directus-explorer
          DIRECTUS_INSTANCE: ${{ secrets.DIRECTUS_INSTANCE }}
          DIRECTUS_USERNAME: ${{ secrets.DIRECTUS_USERNAME }}
          DIRECTUS_PASSWORD: ${{ secrets.DIRECTUS_PASSWORD }}

      - name: Upload public artifact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Download public artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: Deploy to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: www.dbgi.org
