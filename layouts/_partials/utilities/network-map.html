{{- $id := .id -}}
{{- $class := .class -}}
{{- $gardens := hugo.Data.gardens.gardens | default slice -}}
{{- $labs := hugo.Data.labs.labs | default slice -}}

<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<div id="{{ $id }}" class="dbgi-garden-map dbgi-network-map{{ with $class }} {{ . }}{{ end }}" data-gardens='{{ $gardens | jsonify }}' data-labs='{{ $labs | jsonify }}'></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/js/network-map.js"></script>
