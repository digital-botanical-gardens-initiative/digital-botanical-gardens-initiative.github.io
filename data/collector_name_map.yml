# Maps Directus's free-text Field_Data.collector_fullname values (from
# data/collector_stats.yml, produced by scripts/update-collector-stats.mjs) to
# content/team/<slug>/ people. Directus has no ORCID/relation link for collectors,
# so the same person can appear under multiple spellings; this file is the manual
# reconciliation. Regenerate the featured-team ranking by hand whenever
# collector_stats.yml is refreshed with materially different counts.
#
# collected_samples below is the sum across all directus_names variants, as of
# the 2026-08-05 collector_stats.yml snapshot.
people:
