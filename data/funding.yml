      - title: Anticipating the Chemistry of Life
        grant_number: "10000895"
        scheme: Project funding
        period: 2024-10-01 - 2028-09-30
        amount: 397'854 CHF
        status: ongoing
        url: https://data.snf.ch/grants/grant/10000895
        summary: Computational metabolomics, chemodiversity, natural products, and linked open knowledge.
      - title: Biological complexity addressed by mass spectrometry
        grant_number: "229588"
        scheme: R'EQUIP
        period: 2024-12-01 - 2025-11-30
        amount: 700'000 CHF
        status: completed
        url: https://data.snf.ch/grants/grant/229588
        summary: Mass spectrometry infrastructure supporting metabolomics and proteomics at the University of Fribourg.
      - title: MetaboLinkAI
        grant_number: "10002786"
        scheme: Weave/Lead Agency
        period: 2025-04-01 - 2029-03-31
        amount: 3'254'428 CHF
        status: ongoing
        url: https://data.snf.ch/grants/grant/10002786
        summary: Knowledge graphs and AI for querying, interpreting, and reusing metabolomics data.

  - key: swissuniversities
