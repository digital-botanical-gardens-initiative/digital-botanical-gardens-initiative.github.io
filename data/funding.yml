funders:
  - key: snsf
    name: Swiss National Science Foundation
    short_name: SNSF
    logo: /img/funders/snsf.svg
    url: https://www.snf.ch/en
    grants:
      - title: "MetaDiv: Ecological and Evolutionary drivers of phytochemical diversity"
        grant_number: "215724"
